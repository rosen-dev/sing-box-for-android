  # 用于放行那些被 Blacklist 广谱拦截但仍需使用的特定子域名。
  # 例如：Blacklist 拦截了 youtube.com，此处放行 accounts.youtube.com 以确保登录正常。
  - DOMAIN-SUFFIX,accounts.youtube.com,PROXY
  - DOMAIN-KEYWORD,accounts.youtube.com.,PROXY  # 确保所有国家的accounts.youtube.com域名都可以访问
