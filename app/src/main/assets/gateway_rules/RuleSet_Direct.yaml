  # ==========================================================
  # RuleSet for DIRECT Connections (直连规则 - 纯域名规范)
  # ==========================================================

  # Local Domain (本地与局域网域名)
  - DOMAIN-SUFFIX,local
  - DOMAIN-SUFFIX,lan
  - DOMAIN-SUFFIX,home.arpa

  ############ SpeedTest ############
  # > Fast
  - DOMAIN-SUFFIX,fast.com

  # > Speedtest by Ookla
  - DOMAIN-KEYWORD,speedtest
  - DOMAIN-SUFFIX,ooklaserver.net
  - DOMAIN,speed.dler.io

  # > Speed Test by Cloudflare
  - DOMAIN-SUFFIX,speed.cloudflare.com
  ############ SpeedTest END ############

  # 私人 DNS 服务 (屏蔽微信和支付宝中短视频)
  - DOMAIN-SUFFIX,nextdns.io

  # 小米生态
  - DOMAIN-SUFFIX,mi.com
  - DOMAIN-SUFFIX,mi-img.com
  - DOMAIN-SUFFIX,miui.com
  - DOMAIN-SUFFIX,xiaomi.com

  # 商米 (Sunmi)
  - DOMAIN-SUFFIX,sunmi.com

  # DeepSeek
  - DOMAIN-KEYWORD,deepseek
  - DOMAIN-SUFFIX,deepseek.com
  - DOMAIN-SUFFIX,deepseek.cn

  # Tencent Cloud & Payment (腾讯云与支付)
  - DOMAIN-SUFFIX,tencentcloudapi.com
  - DOMAIN-SUFFIX,cloudbase.net
  - DOMAIN-SUFFIX,tcb.qcloud.la
  - DOMAIN-SUFFIX,myqcloud.com
  - DOMAIN-SUFFIX,alipay.com
  - DOMAIN-SUFFIX,tenpay.com
  - DOMAIN,api.mch.weixin.qq.com

  # Memfire (国内 Supabase 替代)
  - DOMAIN-SUFFIX,memfiredb.com
  - DOMAIN-SUFFIX,memfire.com

  # Aliyun Maven & npm Mirror / 国内开发者服务
  - DOMAIN-SUFFIX,aliyun.com
  - DOMAIN-SUFFIX,aliyuncdn.com
  - DOMAIN-SUFFIX,gitee.com
  - DOMAIN-SUFFIX,gitee.io
  - DOMAIN-SUFFIX,gitcode.com

  # BoardMix (博思白板 & 华为云存储 & 客服)
  - DOMAIN-SUFFIX,boardmix.cn
  - DOMAIN-SUFFIX,boardmix.com
  - DOMAIN-SUFFIX,bosyun.cn
  - DOMAIN-SUFFIX,bosyun.net
  - DOMAIN-SUFFIX,obs.cn-east-3.myhuaweicloud.com
  - DOMAIN-SUFFIX,qiyukf.com
