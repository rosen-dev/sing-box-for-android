name: Build Android APKs

on:
  push:
    branches:
      - main
      - feature/gateway
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build sing-box for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android App
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      - name: Install Gomobile Tools
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          gomobile init

      - name: Checkout sing-box Core & Build libbox.aar
        run: |
          git clone --depth=1 --branch v1.13.20 https://github.com/SagerNet/sing-box.git /tmp/sing-box-core
          cd /tmp/sing-box-core
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          go run ./cmd/internal/build_libbox -target android
          mkdir -p $GITHUB_WORKSPACE/app/libs
          cp libbox.aar $GITHUB_WORKSPACE/app/libs/libbox.aar
          cd $GITHUB_WORKSPACE

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs (assembleOtherRelease & assembleOtherDebug)
        run: |
          chmod +x gradlew
          ./gradlew assembleOtherRelease assembleOtherDebug --stacktrace

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFA-Release-APKs
          path: |
            app/build/outputs/apk/other/release/*.apk
            app/build/outputs/apk/other/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/other/release/*.apk
            app/build/outputs/apk/other/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
