name: Build libbox.aar

on:
  workflow_dispatch:

env:
  SING_BOX_VERSION: "v1.14.0"

jobs:
  build-libbox:
    name: Build libbox.aar v1.14.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android App
        uses: actions/checkout@v4

      - name: Cache libbox.aar (Smart Cache)
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-aar-${{ env.SING_BOX_VERSION }}-arm64-r28-v1

      - name: Set up Go
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Cache Go build cache & modules
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cache-${{ runner.os }}-${{ env.SING_BOX_VERSION }}
          restore-keys: |
            go-cache-${{ runner.os }}-

      - name: Set up Java 17
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: true

      - name: Build libbox.aar via Official Makefile
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          echo "Building libbox.aar from source (${SING_BOX_VERSION})..."
          git clone --depth=1 --branch ${{ env.SING_BOX_VERSION }} https://github.com/SagerNet/sing-box.git /tmp/sing-box-core
          cd /tmp/sing-box-core
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          make lib_install
          make lib_android
          mkdir -p $GITHUB_WORKSPACE/app/libs
          cp libbox.aar $GITHUB_WORKSPACE/app/libs/libbox.aar
          cd $GITHUB_WORKSPACE

      - name: Upload libbox.aar Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar-v1.14.0
          path: app/libs/libbox.aar
          compression-level: 1
