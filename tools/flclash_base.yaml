# ==============================================================================
# Flclash for Android 自定义配置文件
# 适配架构：基于 Sing-box for Android 本地网关 5 层分流架构
# 核心节点：链接至本机 oixcloud 定制版 Flclash (127.0.0.1:7890)
# ==============================================================================

# --- 基础运行参数 ---
# 入站混合监听端口设为 8899 (对齐本项目的旁路由网关端口 8899，避免与 7890 冲突)
mixed-port: 8899
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
tcp-concurrent: true
find-process-mode: strict

# --- 流量嗅探 (Sniffer: 对应 Sing-box "action": "sniff") ---
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# --- TUN 虚拟网卡模式 (Android VPN 专用) ---
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

# --- DNS 引擎 (对应 Sing-box fastDNS 规范: 国内极速 + 远端防污染) ---
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# --- 代理节点列表 (唯一物理节点: 转发至本机 oixcloud 定制版) ---
proxies:
  - name: "oixcloud-local-7890"
    type: socks5
    server: 127.0.0.1
    port: 7890
    udp: true
    skip-cert-verify: true

# --- 策略分流组 (PROXY 选择器) ---
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "oixcloud-local-7890"
      - DIRECT

# --- 5 层分流路由规则 ---
rules:
  # ==========================================================
  # Layer 0: 基础直通与 DNS/局域网保障
  # ==========================================================
  # 0.1 远端 DNS 服务器 IP 直通走 PROXY
  - IP-CIDR,1.1.1.1/32,PROXY,no-resolve
  - IP-CIDR,1.0.0.1/32,PROXY,no-resolve
  - IP-CIDR,8.8.8.8/32,PROXY,no-resolve
  - IP-CIDR,8.8.4.4/32,PROXY,no-resolve

  # 0.2 国内直连 DNS 服务器 IP 走 DIRECT
  - IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
  - IP-CIDR,223.6.6.6/32,DIRECT,no-resolve
  - IP-CIDR,119.29.29.29/32,DIRECT,no-resolve
  - IP-CIDR,180.184.1.1/32,DIRECT,no-resolve

  # 0.3 原生局域网与私有 IP 直连
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  # 0.4 特殊直连网段 (Apple 17.0.0.0/8、运营商 CGNAT 100.64.0.0/10)
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve

  # ==========================================================
  # Layer 1: 特定设备条件拦截规则 (Clash Meta 逻辑 AND 规则)
  # ==========================================================
  - AND,((SRC-IP-CIDR,192.168.10.50/32),(DOMAIN-SUFFIX,googlevideo.com)),REJECT
